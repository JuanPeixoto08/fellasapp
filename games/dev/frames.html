<!doctype html>
<!-- Só no dev: a mesa no tamanho do celular em pé e do PC, lado a lado, com o banco simulado (?mock). -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mesas (dev)</title>
    <style>
      body { margin: 0; background: #333; display: flex; gap: 24px; padding: 16px; align-items: flex-start; }
      iframe { border: 0; flex: none; }
    </style>
  </head>
  <body>
    <iframe id="phone" width="390" height="844"></iframe>
    <iframe id="pc" width="1280" height="720"></iframe>
    <script>
      const game = new URLSearchParams(location.search).get('game') || 'blackjack';
      for (const id of ['phone', 'pc']) document.getElementById(id).src = `../${game}/?mock&shot`;
    </script>
  </body>
</html>
